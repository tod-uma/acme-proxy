---
- name: Verify required acme-proxy variables
  ansible.builtin.assert:
    that:
      - acme_proxy_ca_url | length > 0
      - acme_proxy_account_email | length > 0
      - acme_proxy_dns_names is defined
      - acme_proxy_dns_names | length > 0
    fail_msg: >-
      Required variables are missing. You must define:
      acme_proxy_ca_url, acme_proxy_account_email, and
      acme_proxy_dns_names (with at least one entry).

- name: Verify EAB credentials are paired
  ansible.builtin.assert:
    that:
      - (acme_proxy_eab_kid | length > 0) == (acme_proxy_eab_hmac_key | length > 0)
    fail_msg: >-
      EAB credentials must be set together: both acme_proxy_eab_kid
      and acme_proxy_eab_hmac_key, or neither.
  when: acme_proxy_eab_kid | length > 0 or acme_proxy_eab_hmac_key | length > 0

# The template renders the size through `int`, which turns a typo into 0 and
# step-ca then silently uses its 2048-bit default.
- name: Verify the TLS key size
  ansible.builtin.assert:
    that:
      - acme_proxy_tls_key_type | upper == "RSA"
      - acme_proxy_tls_key_size | string is match('^[0-9]+$')
      - acme_proxy_tls_key_size | int >= 2048
    fail_msg: >-
      acme_proxy_tls_key_size must be a whole number of bits, at least 2048,
      and is only valid with acme_proxy_tls_key_type RSA
      (got {{ acme_proxy_tls_key_size }}).
  when:
    - acme_proxy_tls_key_type | length > 0
    - acme_proxy_tls_key_size | string | length > 0

# An empty list means step-ca's ECDSA-only default, and Go never negotiates an
# ECDSA suite with an RSA certificate: the service starts cleanly and then
# rejects every TLS 1.2 client. Only TLS 1.3 clients would still connect.
- name: Verify the cipher suites match an RSA TLS key
  ansible.builtin.assert:
    that:
      - acme_proxy_tls_cipher_suites | select('match', '^TLS_ECDHE_RSA_') | list | length > 0
    fail_msg: >-
      acme_proxy_tls_key_type is RSA but acme_proxy_tls_cipher_suites has no
      TLS_ECDHE_RSA_* suite, so TLS 1.2 clients could not connect.
  when: acme_proxy_tls_key_type | upper == "RSA"
